plugins { id 'com.android.application' }
android {
    namespace 'org.example.botwlab'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.example.botwlab'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7-arm64-execution'
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
