name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate private BOTW native port builder without game data
        run: |
          python3 -m unittest discover -s tests -p botw_port_builder_test.py -v
          python3 port_botw/build_port.py --help > /tmp/botw-port-usage.txt
      - name: Deep Switch ROM inspector tests (synthetic NSP XCI NSO NRO only)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O2 \
            tests/switch_deep_analyzer_test.cpp -o /tmp/switch_deep_analyzer_test
          /tmp/switch_deep_analyzer_test
      - name: Android NSP/XCI read-only inspector tests (synthetic fixtures)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -O2 tests/switch_container_android_test.cpp -o /tmp/switch_container_android_test
          /tmp/switch_container_android_test
      - name: Validate Galaxy A57 Vulkan compatibility patch (offline, no emulator build)
        run: python3 -m unittest discover -s tests -p eden_a57_patch_test.py -v
      - name: Validate privately supplied ROM container intake (synthetic fixtures only)
        run: python3 -m unittest discover -s tests -p rom_container_inspector_test.py -v
      - name: Run NSO metadata validation (host, synthetic test fixtures)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/nso_format_test.cpp -o /tmp/nso_format_test
          /tmp/nso_format_test
      - name: Test bounded NSO LZ4 and image reconstruction
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/nso_memory_test.cpp -o /tmp/nso_memory_test
          /tmp/nso_memory_test
      - name: Validate synthetic ARM64 executable fixture on host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/synthetic_nso_test.cpp -o /tmp/synthetic_nso_test
          /tmp/synthetic_nso_test
      - name: Validate synthetic linked AArch64 module
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/linked_nso_test.cpp -o /tmp/linked_nso_test
          /tmp/linked_nso_test
      - name: Test read-only MOD0 ELF64 dynamic and relocation inspector
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/mod0_inspector_test.cpp -o /tmp/mod0_inspector_test
          /tmp/mod0_inspector_test
      - name: Test read-only NRO0 homebrew file format and ASET resources
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/nro_inspector_test.cpp -o /tmp/nro_inspector_test
          /tmp/nro_inspector_test
      - name: Test isolated ELF64 RELR relocation dry-run (no executable pages)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/relr_simulator_test.cpp -o /tmp/relr_simulator_test
          /tmp/relr_simulator_test
      - name: Check Homebrew ABI and static Horizon SVC patterns
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/nro_runtime_audit_test.cpp -o /tmp/nro_runtime_audit_test
          /tmp/nro_runtime_audit_test
      - name: Download and inspect real open-source NRO (ftpd classic, no execution)
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 90             --output /tmp/ftpd-classic.nro             https://github.com/mtheall/ftpd/releases/download/v3.2.1/ftpd-classic.nro
          g++ -std=c++17 -Wall -Wextra -Werror -O2             tests/nro_open_homebrew_test.cpp -o /tmp/nro_open_homebrew_test
          /tmp/nro_open_homebrew_test /tmp/ftpd-classic.nro
      - name: Test graphics baseline requirements based on open source Wonder recomp
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/vulkan_runtime_probe_test.cpp -o /tmp/vulkan_runtime_probe_test
          /tmp/vulkan_runtime_probe_test
      - name: Validate Vulkan readback acceptance criteria (host, synthetic pixels)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/vulkan_offscreen_test.cpp -o /tmp/vulkan_offscreen_test
          /tmp/vulkan_offscreen_test
      - name: Compile GLSL shaders to Vulkan 1.3 SPIR-V and validate them
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
          python3 scripts/generate_triangle_spirv.py
          test -s app/src/main/cpp/generated_triangle_spirv.h
      - name: Verify foreground and background GPU readback expectations
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/vulkan_triangle_test.cpp -o /tmp/vulkan_triangle_test
          /tmp/vulkan_triangle_test
      - name: Recompile independent AArch64 NSO with pinned open source recompiler
        run: |
          python3 -m venv /tmp/aot-recomp-env
          /tmp/aot-recomp-env/bin/python -m pip install -q capstone==5.0.6 lz4==4.4.4
          /tmp/aot-recomp-env/bin/python recomp_aot/build_upstream_recomp.py
          g++ -std=c++20 -O2 -Wall -Wextra \
            -I app/src/main/cpp/aot_generated/include \
            -I app/src/main/cpp/aot_generated/output \
            recomp_aot/host_smoke_test.cpp \
            app/src/main/cpp/aot_generated/output/code_000.cpp \
            -o /tmp/test_real_static_recomp
          /tmp/test_real_static_recomp
          # Real Clang->ARM64->NSO->upstream recompiler, then CPU + .data/.bss + test SVC.
          g++ -std=c++20 -O2 -Wall -Wextra -pthread \
            -I app/src/main/cpp/aot_generated/include \
            -I app/src/main/cpp/aot_generated \
            -I recomp_aot \
            recomp_aot/homebrew_host_test.cpp \
            recomp_aot/homebrew_test_runtime.cpp \
            app/src/main/cpp/aot_generated/homebrew/code_000.cpp \
            -o /tmp/test_compiled_c_guest
          /tmp/test_compiled_c_guest
      - name: Compile test app (NOT Zelda)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Check APK
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names
              assert 'classes.dex' in names
              assert 'lib/arm64-v8a/libbotwgpu.so' in names
              print('Verified AndroidManifest.xml + classes.dex')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BOTW-Android-HorizonSVC-v024-NOT-PLAYABLE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
