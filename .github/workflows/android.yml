name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          sdkmanager --version
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile test app (NOT Zelda)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Check APK
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names
              assert 'classes.dex' in names
              print('Verified AndroidManifest.xml + classes.dex')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BOTW-Android-TestLab-NOT-GAME
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
