name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run NSO metadata validation (host, synthetic test fixtures)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/nso_format_test.cpp -o /tmp/nso_format_test
          /tmp/nso_format_test
      - name: Test bounded NSO LZ4 and image reconstruction
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/nso_memory_test.cpp -o /tmp/nso_memory_test
          /tmp/nso_memory_test
      - name: Validate synthetic ARM64 executable fixture on host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/synthetic_nso_test.cpp -o /tmp/synthetic_nso_test
          /tmp/synthetic_nso_test
      - name: Validate synthetic linked AArch64 module
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/linked_nso_test.cpp -o /tmp/linked_nso_test
          /tmp/linked_nso_test
      - name: Test read-only MOD0 ELF64 dynamic and relocation inspector
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/mod0_inspector_test.cpp -o /tmp/mod0_inspector_test
          /tmp/mod0_inspector_test
      - name: Test read-only NRO0 homebrew file format and ASET resources
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/nro_inspector_test.cpp -o /tmp/nro_inspector_test
          /tmp/nro_inspector_test
      - name: Test isolated ELF64 RELR relocation dry-run (no executable pages)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tests/relr_simulator_test.cpp -o /tmp/relr_simulator_test
          /tmp/relr_simulator_test
      - name: Download and inspect real open-source NRO (ftpd classic, no execution)
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 90             --output /tmp/ftpd-classic.nro             https://github.com/mtheall/ftpd/releases/download/v3.2.1/ftpd-classic.nro
          g++ -std=c++17 -Wall -Wextra -Werror -O2             tests/nro_open_homebrew_test.cpp -o /tmp/nro_open_homebrew_test
          /tmp/nro_open_homebrew_test /tmp/ftpd-classic.nro
      - name: Compile test app (NOT Zelda)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Check APK
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names
              assert 'classes.dex' in names
              assert 'lib/arm64-v8a/libbotwgpu.so' in names
              print('Verified AndroidManifest.xml + classes.dex')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BOTW-Android-RELR-Sandbox-v013-NOT-GAME
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
