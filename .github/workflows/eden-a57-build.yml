name: Eden Galaxy A57 v2 low-memory APK (NO GAMES)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eden-a57-build.yml'
      - 'eden_a57/GalaxyA57Preset.kt'
      - 'eden_a57/apply_to_eden.py'

permissions:
  contents: read

concurrency:
  group: eden-a57-apk-build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      JAVA_TOOL_OPTIONS: -Xmx3g
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      GRADLE_OPTS: -Dorg.gradle.workers.max=3 -Dorg.gradle.jvmargs=-Xmx3g
      EDEN_PIN: de7e6e01d43e8cf2ec193d74fa053b0d7949955f
    steps:
      - name: Checkout our auditable GPLv3 device adapter
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
      - name: SDK 36, CMake 3.31.6 and Android NDK r28
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Prepare build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache libssl-dev pkg-config glslang-tools spirv-tools
          df -h .
      - name: Fetch exact Eden source revision (not a Nintendo game)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/eden-emulator/mirror.git /tmp/eden
          git -C /tmp/eden fetch --depth=1 origin "$EDEN_PIN"
          git -C /tmp/eden checkout --detach "$EDEN_PIN"
          test "$(git -C /tmp/eden rev-parse HEAD)" = "$EDEN_PIN"
          git -C /tmp/eden submodule update --init --recursive --depth=1
      - name: Stage SDL3 Android Java JNI wrappers at native SDL version
        run: |
          # Eden's Gradle sourceset references generated/sdl/java, which is not
          # included in a fresh checkout. Fetch the matching official SDL3
          # sources (SDL's own zlib license), never a stub implementation.
          SDL_PIN=147a8ee32dbf9ac02f3794964490687b6bbda1bc
          git init -q /tmp/SDL3-Java
          git -C /tmp/SDL3-Java remote add origin https://github.com/libsdl-org/SDL.git
          git -C /tmp/SDL3-Java sparse-checkout init --cone
          git -C /tmp/SDL3-Java sparse-checkout set android-project/app/src/main/java/org/libsdl/app
          git -C /tmp/SDL3-Java fetch --depth=1 --filter=blob:none origin "$SDL_PIN"
          git -C /tmp/SDL3-Java checkout --detach FETCH_HEAD
          test "$(git -C /tmp/SDL3-Java rev-parse HEAD)" = "$SDL_PIN"
          source=/tmp/SDL3-Java/android-project/app/src/main/java/org/libsdl/app
          target=/tmp/eden/externals/generated/sdl/java/org/libsdl/app
          mkdir -p "$target"
          cp "$source"/*.java "$target"/
          test -s "$target/SDL.java"
          test -s "$target/SDLActivity.java"
          echo "Staged $(find "$target" -name '*.java' | wc -l) official SDL3 Java wrappers"
      - name: Apply Samsung Xclipse 550 first-run settings + Vulkan driver diagnostics
        run: |
          python3 -m unittest discover -s tests -p eden_a57_patch_test.py -v
          python3 eden_a57/apply_to_eden.py /tmp/eden
          git -C /tmp/eden diff --check
          git -C /tmp/eden diff -- src/android/app/src/main/java/org/yuzu/yuzu_emu/YuzuApplication.kt src/video_core/vulkan_common/vulkan_device.cpp > /tmp/device-changes.patch
      - name: Build complete Eden Android APK for Galaxy A57
        run: |
          cd /tmp/eden/src/android
          chmod +x gradlew
          ./gradlew :app:assembleMainlineRelWithDebInfo --no-daemon --stacktrace --max-workers=3
      - name: Check compiled output and retain traceable source attribution
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path("/tmp/eden/src/android/app/build/outputs/apk")
          builds=list(root.rglob("*.apk"))
          assert builds, "No APK generated"
          good=[]
          for p in builds:
              with zipfile.ZipFile(p) as z:
                  names=z.namelist()
                  if any(n.startswith("lib/arm64-v8a/") and n.endswith(".so") for n in names):
                      good.append(p)
          assert good, "APK missing ARM64 shared library"
          out=pathlib.Path("eden_a57_artifacts")
          out.mkdir()
          (out/"SOURCE_AND_LICENSE.txt").write_text(
              "Experimental modified Eden Android APK. GPL-3.0-or-later. "
              "Original Eden source: https://github.com/eden-emulator/mirror "
              "at exact revision de7e6e01d43e8cf2ec193d74fa053b0d7949955f. "
              "Modifications and complete patch source: "
              "https://github.com/Oscar4970/The-legend-of-zelda-breath-of-the-wild-/tree/main/eden_a57. "
              "No ROM, keys, firmware or game assets included.\n", encoding="utf-8")
          import shutil
          shutil.copy2(good[0],out/"Eden_Galaxy_A57_Xclipse550_LOW_MEMORY_v2.apk")
          print("Verified APK",out/"Eden_Galaxy_A57_Xclipse550_LOW_MEMORY_v2.apk")
          PY
          cp /tmp/device-changes.patch eden_a57_artifacts/eden-a57-changes.patch
      - name: Upload experimental GPL-compatible Android build (no game data)
        uses: actions/upload-artifact@v4
        with:
          name: Eden-A57-Xclipse550-LOW-MEMORY-V2-NO-GAME
          path: eden_a57_artifacts/
          retention-days: 7
          if-no-files-found: error
